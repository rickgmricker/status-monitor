@baseTheme=dark
@background=#151619
@header=#1D1F23
@panel=#202226
@button=#2B2D33
@hover=#363940
@border=#44474F
@foreground=#E2E3E7
@secondary=#969AA5
@accentColor=#526DE1
@accentHover=#647DED
@focus=#8C9EFF
@selectionBackground=#38456E
@selectionForeground=@foreground
@actionForeground=#E2E3E7
@error=#FF9FBA
@closeHover=#FF9FBA
@closeText=#151619
defaultFont=12 "Segoe UI"

*.background=@panel
*.foreground=@foreground
*.selectionBackground=@selectionBackground
*.selectionForeground=@foreground
RootPane.background=@background
Panel.background=@panel
Label.disabledForeground=@secondary
Component.borderColor=@border
Component.focusColor=@focus
Component.focusedBorderColor=@focus
Component.error.borderColor=@error
Component.error.focusedBorderColor=@error
Component.arc=6

Button.background=@button
Button.hoverBackground=@hover
Button.pressedBackground=@selectionBackground
Button.default.background=@accentColor
Button.default.hoverBackground=@accentHover
Button.default.foreground=@actionForeground
Button.arc=6
ToggleButton.background=@button
ToggleButton.selectedBackground=@selectionBackground
ToggleButton.hoverBackground=@hover
TextField.background=@panel
TextArea.background=@panel
FormattedTextField.background=@panel
Spinner.background=@panel
ComboBox.background=@button
ComboBox.buttonBackground=@button
ComboBox.buttonHoverBackground=@hover
CheckBox.icon.borderColor=@border
CheckBox.icon.background=@button
CheckBox.icon.selectedBackground=@accentColor
CheckBox.icon.focusColor=@focus
CheckBox.icon.checkmarkColor=@actionForeground
TabbedPane.background=@header
TabbedPane.selectedBackground=@panel
TabbedPane.hoverColor=@hover
TabbedPane.underlineColor=@accentColor
TabbedPane.contentAreaColor=@border
ProgressBar.background=@button
ProgressBar.foreground=@accentColor
ProgressBar.selectionBackground=@actionForeground
ProgressBar.selectionForeground=@foreground
ScrollBar.background=@panel
ScrollBar.track=@panel
ScrollBar.thumb=@border
ScrollBar.hoverThumbColor=@secondary
PopupMenu.background=@header
PopupMenu.borderColor=@border
MenuItem.background=@header
MenuItem.selectionBackground=@selectionBackground
ToolTip.background=@header
ToolTip.borderColor=@border
Separator.foreground=@border

Monitor.background=@background
Monitor.headerBackground=@header
Monitor.frameBorderColor=@border
Monitor.headerBorderColor=@border
Monitor.secondaryForeground=@secondary
Monitor.errorForeground=@error
Monitor.hoverBackground=@hover
Monitor.selectedBackground=@selectionBackground
Monitor.accentForeground=@focus
Monitor.closeHoverBackground=@closeHover
Monitor.closeHoverForeground=@closeText
Monitor.gripForeground=@secondary
